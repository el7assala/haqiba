<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0a06">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="حقيبة التفاوض">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>حقيبة التفاوض والترقية</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@500;700&family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap">
<style>
/* Layout: a black-and-gold app shell — splash, a grid of chapter buttons, and chapter screens that open with a story-style carousel */
:root{
  --ink:#0d0a06; --panel:#17110a; --panel-2:#21180d;
  --gold:#d6a54e; --gold-hi:#f4d68f; --gold-lo:#8f6a2a;
  --cream:#f3e7c9; --muted:#b39c76; --line:rgba(214,165,78,.28);
  --ok:#7fbf7a; --warn:#e2a84a;
  --display:"Reem Kufi","Noto Kufi Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic","Noto Sans Arabic","Geeza Pro","Segoe UI",Tahoma,sans-serif;
  --r:14px;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--cream)}
body{font-family:var(--body);font-size:16px;line-height:1.75;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);text-wrap:balance;line-height:1.35;margin:0}
.gold-text{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 55%,var(--gold-lo));-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:50;background:radial-gradient(120% 80% at 50% 40%,#1d150b 0,var(--ink) 65%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;transition:opacity .7s ease,visibility .7s}
#splash.out{opacity:0;visibility:hidden}
.sp-emblem{position:relative;width:min(46vw,210px);aspect-ratio:380/445;max-width:100%}
.sp-emblem img{width:100%;height:100%;object-fit:contain;display:block;animation:emIn 1.6s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 0 rgba(244,214,143,0))}
.sp-emblem::after{content:"";position:absolute;inset:0;-webkit-mask:var(--em) center/contain no-repeat;mask:var(--em) center/contain no-repeat;background:linear-gradient(115deg,transparent 35%,rgba(255,244,210,.85) 50%,transparent 65%);background-size:260% 100%;animation:shine 2.6s 1.2s ease-in-out both;mix-blend-mode:screen}
.sp-glow{position:absolute;inset:-30%;background:radial-gradient(circle,rgba(214,165,78,.35),transparent 60%);animation:glow 3s 1s ease-out both;z-index:-1}
.sp-word{font-family:var(--display);font-weight:700;font-size:clamp(44px,13vw,76px);line-height:1;animation:up 1s 1.5s both}
.sp-tag{color:var(--muted);font-size:15px;animation:up 1s 1.9s both}
.sp-title{font-family:var(--display);font-size:clamp(20px,5.4vw,26px);color:var(--cream);animation:up 1s 2.4s both;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:8px 18px}
.sp-actions{display:flex;flex-direction:column;gap:10px;align-items:center;animation:up 1s 2.9s both}
.btn-gold{background:linear-gradient(180deg,var(--gold-hi),var(--gold) 60%,var(--gold-lo));color:#1a1207;border:0;border-radius:999px;padding:12px 34px;font-weight:700;font-size:17px;box-shadow:0 6px 24px rgba(214,165,78,.25)}
.btn-ghost{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:4px}
@keyframes emIn{0%{opacity:0;transform:scale(.55) rotate(-8deg)}60%{opacity:1}100%{opacity:1;transform:none}}
@keyframes shine{0%{background-position:120% 0}100%{background-position:-60% 0}}
@keyframes glow{0%{opacity:0;transform:scale(.6)}100%{opacity:1;transform:none}}
@keyframes up{0%{opacity:0;transform:translateY(14px)}100%{opacity:1;transform:none}}

/* ---------- app bar ---------- */
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--ink)}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:rgba(13,10,6,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px}
.bar img{width:30px;height:35px;object-fit:contain}
.bar-title{flex:1;min-width:0;font-family:var(--display);font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:var(--gold-hi);stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.icon-btn[aria-pressed="false"] svg{stroke:var(--muted)}

main{padding-block:20px 48px}
.view{animation:fade .35s ease both}
@keyframes fade{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* ---------- home ---------- */
.hero{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center;padding:18px;border:1px solid var(--line);border-radius:var(--r);background:linear-gradient(160deg,var(--panel-2),var(--panel))}
.hero img{width:74px;height:87px;object-fit:contain}
.hero h1{font-size:clamp(22px,6vw,30px)}
.hero p{margin:4px 0 0;color:var(--muted);font-size:15px}
.rule{margin:6px 0 0;font-size:15px}
.sec-label{margin:26px 0 10px;color:var(--gold);font-size:13px;letter-spacing:.04em;font-weight:700}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:620px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{display:flex;flex-direction:column;gap:6px;text-align:start;padding:14px;border-radius:var(--r);border:1px solid var(--line);background:var(--panel);min-height:112px;transition:transform .15s,border-color .15s}
.tile:hover,.tile:active{border-color:var(--gold);transform:translateY(-2px)}
.tile .n{font-family:var(--display);color:var(--gold);font-size:13px}
.tile .t{font-family:var(--display);font-size:17px;line-height:1.4}
.tile .s{color:var(--muted);font-size:13px;line-height:1.5}
.tile.tool{background:linear-gradient(160deg,#2a1e0e,var(--panel))}
.prog{margin-top:auto;height:3px;border-radius:3px;background:rgba(214,165,78,.15);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--gold)}

/* ---------- carousel ---------- */
.reel{position:relative;aspect-ratio:9/12;max-height:72vh;width:100%;max-width:440px;margin:0 auto;border-radius:18px;overflow:hidden;background:radial-gradient(90% 70% at 50% 35%,#24190c,#0c0905 75%);border:1px solid var(--line);user-select:none;-webkit-user-select:none;touch-action:pan-y}
.reel::before{content:"";position:absolute;inset:10px;border:1px solid rgba(214,165,78,.45);border-radius:12px;pointer-events:none}
.reel::after{content:"";position:absolute;inset:18px;border:1px solid rgba(214,165,78,.18);border-radius:8px;pointer-events:none}
.reel .wm{position:absolute;inset:auto 0 18% 0;margin:auto;width:42%;opacity:.07;pointer-events:none}
.bars{position:absolute;top:22px;inset-inline:26px;display:flex;gap:4px;z-index:3}
.bars span{flex:1;height:3px;border-radius:3px;background:rgba(244,214,143,.22);overflow:hidden}
.bars span i{display:block;height:100%;width:0;background:var(--gold-hi)}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:14px;padding:56px 34px 64px;opacity:0;transition:opacity .45s}
.slide.on{opacity:1}
.slide .k{font-size:13px;color:var(--gold);letter-spacing:.04em}
.slide .h{font-family:var(--display);font-weight:700;font-size:clamp(24px,7vw,34px);line-height:1.45}
.slide .p{font-size:clamp(16px,4.4vw,19px);color:var(--cream);line-height:1.7}
.slide ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:clamp(15px,4.2vw,18px)}
.slide li{border:1px solid var(--line);border-radius:999px;padding:6px 16px;background:rgba(23,17,10,.7)}
.slide.on>*{animation:up .7s both}
.slide.on>*:nth-child(2){animation-delay:.25s}.slide.on>*:nth-child(3){animation-delay:.5s}.slide.on>*:nth-child(4){animation-delay:.75s}
.reel-ctrl{position:absolute;bottom:18px;inset-inline:0;display:flex;justify-content:center;gap:12px;z-index:3}
.reel-ctrl button{width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:rgba(13,10,6,.75);display:grid;place-items:center}
.reel-ctrl svg{width:18px;height:18px;fill:var(--gold-hi)}
.count{position:absolute;top:34px;inset-inline-end:28px;font-size:12px;color:var(--muted);z-index:3;font-variant-numeric:tabular-nums}

/* ---------- chapter text ---------- */
.ch-head{margin:24px 0 8px}
.ch-head .n{color:var(--gold);font-size:13px;font-weight:700}
.ch-head h2{font-size:clamp(22px,6vw,28px)}
.lead{font-size:17px;color:var(--cream)}
.card{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);padding:16px;margin:14px 0}
.card h3{font-size:17px;color:var(--gold-hi);margin-bottom:6px}
.card ol,.card ul{margin:0;padding-inline-start:22px}
.card li{margin:4px 0}
blockquote{margin:12px 0;padding:12px 16px;border-inline-start:3px solid var(--gold);background:var(--panel-2);border-radius:0 10px 10px 0;color:var(--cream)}
.tbl{overflow-x:auto;margin:10px 0}
table{border-collapse:collapse;width:100%;min-width:460px;font-size:15px}
th,td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:start;vertical-align:top}
th{color:var(--gold);font-weight:700;font-size:14px}
.warn{border-color:rgba(226,168,74,.5)}
.warn h3{color:var(--warn)}
.nav-row{display:flex;gap:10px;margin-top:26px}
.nav-row button{flex:1;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--panel);font-family:var(--display);font-size:15px}
.nav-row .primary{background:linear-gradient(180deg,var(--gold-hi),var(--gold));color:#1a1207;border:0;font-weight:700}

/* ---------- scripts ---------- */
details.scr{border:1px solid var(--line);border-radius:var(--r);background:var(--panel);margin:10px 0;overflow:hidden}
details.scr summary{list-style:none;padding:14px 16px;display:flex;gap:12px;align-items:center;cursor:pointer;font-family:var(--display);font-size:16px}
details.scr summary::-webkit-details-marker{display:none}
details.scr summary .no{flex:none;width:30px;height:30px;border-radius:50%;border:1px solid var(--gold);color:var(--gold);display:grid;place-items:center;font-size:13px;font-variant-numeric:tabular-nums}
details.scr[open] summary{border-bottom:1px solid var(--line)}
.scr-body{padding:14px 16px}
.scr-text{white-space:pre-wrap;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:15.5px}
.why{color:var(--muted);font-size:14px;margin:10px 0 0}
.copy{margin-top:10px;border:1px solid var(--gold);background:none;color:var(--gold-hi);border-radius:999px;padding:7px 18px;font-size:14px}

/* ---------- tools ---------- */
.form{display:grid;gap:12px}
.field{display:grid;gap:4px}
.field label{font-size:14px;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:11px 12px;color:var(--cream);font:inherit;font-variant-numeric:tabular-nums}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--gold);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.result{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:6px}
.res{border:1px solid var(--line);border-radius:12px;padding:12px;background:var(--panel-2)}
.res .l{font-size:13px;color:var(--muted)}
.res .v{font-family:var(--display);font-size:24px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.res.red .v{color:#e58b6b}
.range{position:relative;height:12px;border-radius:6px;background:linear-gradient(90deg,rgba(214,165,78,.15),rgba(214,165,78,.5));margin:18px 0 26px}
.range b{position:absolute;top:-6px;width:4px;height:24px;border-radius:2px;transform:translateX(50%)}
.range small{position:absolute;top:22px;transform:translateX(50%);font-size:12px;white-space:nowrap;color:var(--muted)}
.log-item{display:grid;grid-template-columns:1fr auto;gap:8px;border-bottom:1px solid var(--line);padding:10px 0}
.log-item .m{color:var(--gold);font-size:13px}
.log-item button{background:none;border:0;color:var(--muted);font-size:13px}
.empty{color:var(--muted);text-align:center;padding:18px;border:1px dashed var(--line);border-radius:12px}
.check{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.check input{width:22px;height:22px;accent-color:var(--gold);flex:none;margin-top:4px}
.check label{cursor:pointer}
.check input:checked+label{color:var(--muted);text-decoration:line-through}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%) translateY(20px);background:var(--gold);color:#1a1207;padding:9px 20px;border-radius:999px;font-weight:700;opacity:0;transition:.3s;z-index:60;pointer-events:none}
.toast.on{opacity:1;transform:translateX(-50%)}
.lock{position:absolute;top:12px;inset-inline-end:12px;font-size:11px;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:1px 8px;background:var(--ink)}
.tile{position:relative}
.free{color:var(--ok)!important}
.buy-hero{text-align:center;padding:22px 16px;border:1px solid var(--gold);border-radius:18px;background:radial-gradient(90% 80% at 50% 0,#2b1f0e,var(--panel))}
.price{font-family:var(--display);font-size:46px;line-height:1.1;font-variant-numeric:tabular-nums}
.price s{font-size:20px;color:var(--muted);margin-inline-start:8px}
.steps{counter-reset:st;list-style:none;padding:0;margin:0;display:grid;gap:12px}
.steps li{counter-increment:st;display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start}
.steps li::before{content:counter(st);width:34px;height:34px;border-radius:50%;background:var(--gold);color:#1a1207;display:grid;place-items:center;font-weight:700;font-family:var(--display)}
.pay-link{display:block;text-align:center;text-decoration:none;margin-top:8px}
.handle{font-family:var(--body);direction:ltr;unicode-bidi:plaintext;background:var(--ink);border:1px solid var(--line);border-radius:10px;padding:10px 12px;user-select:all;-webkit-user-select:all;text-align:center;font-size:17px}
.code-in{direction:ltr;text-align:center;letter-spacing:.12em;text-transform:uppercase;font-size:20px!important}
.msg{min-height:1.6em;font-size:14px;text-align:center}
.msg.bad{color:#e58b6b}.msg.good{color:var(--ok)}
.foot{color:var(--muted);font-size:13px;text-align:center;margin-top:34px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-delay:0s!important;transition:none!important}}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14px;line-height:1.6;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--gold);flex:none;margin-top:3px}
.warn{border:1px solid var(--gold);background:rgba(214,165,78,.1);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.7}
.warn b{color:var(--gold-hi)}
.file-in{border:1px dashed var(--gold)!important;padding:14px!important;cursor:pointer}
.shot-prev{max-width:140px;border-radius:8px;border:1px solid var(--line);display:none;margin-top:6px}
.left-badge{display:inline-block;margin-top:8px;padding:4px 12px;border-radius:99px;background:rgba(214,165,78,.15);color:var(--gold-hi);font-size:13px}
</style>


</head>

 {id:"intro",n:"البداية",t:"المقدمة",s:"الحقيبة دي لمين، وهتطلع منها بإيه",
  slides:[
   {k:"قاعدة الحقيبة",h:"المرتب مش مكافأة على تعبك..",p:"المرتب سعر قيمتك."},
   {h:"واللي مش بيعرف سعره..",p:"حد تاني بيحدده له."},
   {k:"هتطلع من الحقيبة بـ",ul:["رقم محسوب لقيمتك","رد جاهز لسؤال الراتب","سكريبت لطلب الزيادة","ملف إنجازات للترقية"]},
   {h:"مش كورس نظري.",p:"كل جزء بيخلص بجملة تقولها أو حاجة تعملها."},
   {k:"يلا",h:"افتح الجزء الأول",p:"واعرف قيمتك قبل ما تفتح بقك."}],
  html:`<p class="lead">الحقيبة دي للموظف اللي شغال كويس ومرتبه مش ماشي معاه، واللي عايز يطلب حقه من غير ما يخسر شغله. كل جزء بيخلص بحاجة تعملها أو جملة تقولها.</p>
  <div class="card"><h3>هتطلع منها بـ</h3><ul><li>رقم واضح لقيمتك في السوق، محسوب مش متخمّن.</li><li>إجابة جاهزة لسؤال «الراتب المتوقع كام؟».</li><li>خطة وسكريبت لطلب الزيادة من مديرك.</li><li>ملف إنجازات يخلّي الترقية قرار سهل لمديرك.</li><li>خطة بديلة لو قالوا لأ.</li></ul></div>
  <blockquote>المرتب مش مكافأة على تعبك، المرتب سعر قيمتك. واللي مش بيعرف سعره، حد تاني بيحدده له.</blockquote>
  <div class="card"><h3>إزاي تستخدم الحقيبة</h3><ol><li>اتفرج على الكاروسيل في أول كل جزء.</li><li>اقرأ الشرح تحته.</li><li>استخدم الأدوات: شيت القيمة، ملف الإنجازات، قائمة التحضير.</li><li>انسخ السكريبت اللي محتاجه من بنك السكريبتات.</li></ol></div>`},
 {id:"p1",n:"الجزء 1",t:"اعرف قيمتك",s:"حساب المرتب العادل وخطك الأحمر",
  slides:[
   {k:"الجزء 1",h:"متدخلش أي نقاش عن الفلوس",p:"من غير رقم محسوب."},
   {k:"رقمك بيطلع من 3 مصادر",ul:["السوق","الناس في نفس تخصصك","نتايجك بالأرقام"]},
   {k:"الغلطة الأشهر",h:"تحسب قيمتك على مصاريفك.",p:"«أنا محتاج كذا»"},
   {h:"الشركة مش بتدفع على احتياجك..",p:"بتدفع على اللي بتضيفه."},
   {h:"حدد خطك الأحمر من دلوقتي",p:"مش وإنت قاعد قدامهم."},
   {k:"خطوتك",h:"افتح شيت القيمة",p:"واملاه في 20 دقيقة."}],
  html:`<p class="lead">متدخلش أي نقاش عن الفلوس من غير رقم محسوب. الرقم ده بيطلع من 3 مصادر، ومش من اللي إنت «حاسس إنك تستاهله».</p>
  <div class="card"><h3>مصادر الرقم</h3><ol><li><b>السوق:</b> إعلانات الوظايف اللي بتكتب مرتب، وتقارير شركات التوظيف، والمواقع اللي بتجمع المرتبات.</li><li><b>الناس:</b> 3 أو 4 زمايل في نفس التخصص في شركات تانية. اسأل «الرينج المعتاد لمستوى كذا كام؟» مش «بتاخد كام؟».</li><li><b>نتايجك:</b> وفرت أو دخّلت للشركة كام السنة اللي فاتت؟</li></ol></div>
  <div class="card"><h3>المعادلة</h3><p>رقمك المستهدف يبقى في <b>التلت الأعلى</b> من رينج السوق لو عندك إنجازات بالأرقام، وفي <b>النص</b> لو لأ. وخطك الأحمر تحدده من دلوقتي.</p></div>
  <div class="card warn"><h3>الغلطة الأشهر</h3><p>تحسب قيمتك على مصاريفك. الشركة مش بتدفع على احتياجك، بتدفع على اللي بتضيفه.</p></div>`,
  tool:"sheet"},
 {id:"p2",n:"الجزء 2",t:"في الإنترفيو",s:"الراتب المتوقع و«أوفر كواليفايد»",
  slides:[
   {k:"الجزء 2",h:"اللي يقول رقم الأول..",p:"بيحط السقف."},
   {k:"لما يسألوك",h:"«الراتب المتوقع كام؟»",p:"خليهم يفتحوا الرينج هما."},
   {h:"لو أصرّوا..",p:"قول رينج مش رقم، ويبدأ من رقمك المستهدف."},
   {k:"لما يقولولك",h:"«أوفر كواليفايد»",p:"غالبًا معناها: خايفين منك."},
   {h:"رد على الخوف..",p:"مش على الكلمة."},
   {k:"قبل ما تقبل",ul:["اطلب العرض مكتوب","اسأل عن الصافي والبدلات","خد 24 ساعة تراجع"]}],
  html:`<p class="lead">اللي يقول رقم الأول بيحط السقف. هدفك إنك تخليهم يفتحوا هما الرينج، ولو اتحطيت في الزاوية تقول رينج مش رقم.</p>
  <div class="card"><h3>لما يسألوك «الراتب المتوقع كام؟»</h3><ol><li>المرة الأولى: «خلينا نتأكد الأول إن الدور مناسب، وأنا متأكد إننا هنتفق. إيه الرينج المخصص للوظيفة؟»</li><li>لو أصرّوا: «حسب المسؤوليات اللي اتكلمنا فيها، الرينج المعتاد في السوق من كذا لكذا، وأنا شايف نفسي في الجزء الأعلى منه بسبب كذا.»</li><li>الرينج يبدأ من رقمك المستهدف، مش من خطك الأحمر.</li></ol></div>
  <div class="card"><h3>لما يقولولك «حضرتك أوفر كواليفايد»</h3><p>ده غالبًا خوف من 3 حاجات: إنك تمشي بدري، أو تطلب مرتب أعلى بعد شهرين، أو المدير يحس إنك هتاخد مكانه. رد على الخوف:</p>
  <blockquote>«فاهم قلقكم. أنا بدور على مكان أستقر فيه وأبني حاجة مش محطة. الخبرة دي معناها إنكم هتوفروا وقت التدريب، وهكون سند للمدير مش منافس له.»</blockquote></div>
  <div class="card"><h3>قبل ما تقبل أي عرض</h3><p>اسأل عن المرتب الصافي، والبدلات، والتأمين الطبي، وميعاد أول مراجعة مرتب. واطلب العرض مكتوب. وماتردش في نفس المكالمة: «محتاج 24 ساعة أراجعه.»</p></div>`},

function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove("on"),1600)}
function copyText(txt){const done=()=>toast("اتنسخ");if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>fallback(txt))}else fallback(txt);function fallback(t){const a=document.createElement("textarea");a.value=t;document.body.appendChild(a);a.select();try{document.execCommand("copy");done()}catch(e){toast("ظلّل النص وانسخه")}a.remove()}}

/* ---------- carousel ---------- */
let reelTimer=null;
function stopReel(){if(reelTimer){clearInterval(reelTimer);reelTimer=null}}
function mountReel(el,slides,chId){
  const DUR=5200,TICK=50;
  el.innerHTML=`<img class="wm" src="${EMBLEM}" alt=""><div class="bars">${slides.map(()=>'<span><i></i></span>').join("")}</div><div class="count"></div>`+
   slides.map(s=>`<div class="slide">${s.k?`<div class="k">${esc(s.k)}</div>`:""}${s.h?`<div class="h gold-text">${esc(s.h)}</div>`:""}${s.p?`<div class="p">${esc(s.p)}</div>`:""}${s.ul?`<ul>${s.ul.map(x=>`<li>${esc(x)}</li>`).join("")}</ul>`:""}</div>`).join("")+
   `<div class="reel-ctrl"><button type="button" data-a="prev" aria-label="الشريحة السابقة"><svg viewBox="0 0 24 24"><path d="M8 5l9 7-9 7z"/></svg></button><button type="button" data-a="play" aria-label="تشغيل أو إيقاف"><svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg></button><button type="button" data-a="next" aria-label="الشريحة التالية"><svg viewBox="0 0 24 24"><path d="M16 5l-9 7 9 7z"/></svg></button></div>`;
  const sl=[...el.querySelectorAll(".slide")],bars=[...el.querySelectorAll(".bars i")],cnt=el.querySelector(".count"),playBtn=el.querySelector('[data-a="play"]');
  let i=0,t=0,playing=true;
  const icoPause='<svg viewBox="0 0 24 24"><path d="M7 5h4v14H7zM13 5h4v14h-4z"/></svg>',icoPlay='<svg viewBox="0 0 24 24"><path d="M17 5v14L6 12z"/></svg>';
  function show(n){i=Math.max(0,Math.min(slides.length-1,n));t=0;sl.forEach((s,k)=>s.classList.toggle("on",k===i));bars.forEach((b,k)=>b.style.width=k<i?"100%":"0");cnt.textContent=(i+1)+" / "+slides.length;if(i===slides.length-1){seen[chId]=1;store.set("seen",seen)}}
  function setPlay(p){playing=p;playBtn.innerHTML=p?icoPause:icoPlay}
  stopReel();
  reelTimer=setInterval(()=>{if(!playing||document.hidden)return;t+=TICK;bars[i].style.width=Math.min(100,t/DUR*100)+"%";if(t>=DUR){if(i<slides.length-1)show(i+1);else{setPlay(false);bars[i].style.width="100%"}}},TICK);
  el.addEventListener("click",e=>{const b=e.target.closest("button");if(b){const a=b.dataset.a;if(a==="next")show(i+1);else if(a==="prev")show(i-1);else if(a==="play"){if(!playing&&i===slides.length-1&&t>=DUR)show(0);setPlay(!playing)}return}
    const r=el.getBoundingClientRect();const x=e.clientX-r.left; /* RTL: left side = next */ if(x<r.width/2)show(i+1);else show(i-1)});
  let sx=null;el.addEventListener("touchstart",e=>{sx=e.touches[0].clientX},{passive:true});
  el.addEventListener("touchend",e=>{if(sx===null)return;const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45){dx>0?show(i+1):show(i-1);e.preventDefault()}sx=null});
  show(0);setPlay(true);
}

function apiPost(o){return fetch(API,{method:"POST",redirect:"follow",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(o)}).then(r=>r.json())}
function loadStatus(){if(!navigator.onLine)return;apiGet("action=status").then(d=>{if(!d||!d.ok)return;LEFT=d.left;PRICE=d.price;document.querySelectorAll("[data-left]").forEach(el=>{el.textContent=LEFT>0?("فاضل "+n2a(LEFT)+" من "+n2a(LIMIT)+" اشتراك بالخصم"):"خلص عدد الخصم";el.hidden=false});document.querySelectorAll("[data-price]").forEach(el=>el.textContent=n2a(PRICE))}).catch(()=>{})}
function shrink(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);img.onload=()=>{const m=1400,k=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c.toDataURL("image/jpeg",.72))};img.onerror=()=>rej(new Error("img"));img.src=u})}

function vChapter(id){

  const toolBtn=c.tool?`<button class="primary" type="button" data-go="${c.tool}">${TITLES[c.tool]}</button>`:"";
  app.innerHTML=`<div class="view"><div class="reel" id="reel" aria-label="كاروسيل ${esc(c.t)}"></div>
  <div class="ch-head"><div class="n">${esc(c.n)}</div><h2 class="gold-text">${esc(c.t)}</h2></div>${c.html}
  <div class="nav-row">${prev?`<button type="button" data-go="${prev.id}">${esc(prev.t)}</button>`:""}${toolBtn}${next?`<button type="button" data-go="${next.id}" class="${c.tool?"":"primary"}">${esc(next.t)}</button>`:`<button type="button" data-go="scripts" class="${c.tool?"":"primary"}">بنك السكريبتات</button>`}</div></div>`;

function vSheet(){
  const d=store.get("sheet",{cur:12000,lo:14000,hi:20000,ach:2,rare:"yes",red:""});
  app.innerHTML=`<div class="view"><div class="ch-head"><div class="n">أداة · الجزء 1</div><h2 class="gold-text">شيت القيمة</h2></div>
  <p class="lead">اكتب أرقامك الشهرية بالجنيه أو بأي عملة، والشيت يحسب رقمك المستهدف. الأرقام اللي ظاهرة مثال، غيّرها بأرقامك.</p>
  <form class="form card" id="sheetForm">
   <div class="field"><label for="f-cur">مرتبك الحالي شامل البدلات</label><input id="f-cur" inputmode="numeric" type="number" min="0" value="${d.cur}"></div>

   <div class="field"><label for="f-rare">عندك مهارة نادرة في السوق؟</label><select id="f-rare"><option value="yes">أيوه</option><option value="no">لأ</option></select></div></div>
   <div class="field"><label for="f-red">خطك الأحمر (اختياري، لو سبته فاضي هنقترحه)</label><input id="f-red" inputmode="numeric" type="number" min="0" value="${d.red}"></div>
  </form>
  <div class="result"><div class="res"><div class="l">رقمك المستهدف</div><div class="v" id="r-t">—</div></div><div class="res red"><div class="l">خطك الأحمر</div><div class="v" id="r-r">—</div></div><div class="res"><div class="l">الرينج اللي تقوله</div><div class="v" id="r-g" style="font-size:19px">—</div></div><div class="res"><div class="l">الفرق عن مرتبك الحالي</div><div class="v" id="r-d">—</div></div></div>
  <div class="range" id="rng"></div>
  <div class="card"><h3>جملتك الجاهزة</h3><div class="scr-text" id="r-s"></div><button class="copy" type="button" id="copySheet">انسخ الجملة</button></div>
  <div class="nav-row"><button type="button" data-go="p1">الجزء 1</button><button type="button" data-go="p2" class="primary">الجزء 2</button></div></div>`;
  $("#f-ach").value=d.ach;$("#f-rare").value=d.rare;
  const calc=()=>{
    const v=id=>parseFloat($(id).value)||0;
    const cur=v("#f-cur"),lo=v("#f-lo"),hi=Math.max(v("#f-hi"),lo),ach=+$("#f-ach").value,rare=$("#f-rare").value==="yes",redIn=v("#f-red");
    store.set("sheet",{cur,lo,hi,ach,rare:rare?"yes":"no",red:redIn||""});
    let pos=ach>=2?0.72:ach===1?0.6:0.5; if(rare)pos+=0.08; pos=Math.min(pos,0.9);
    const target=lo+(hi-lo)*pos, red=redIn||Math.max(cur*1.1,lo), askHi=Math.min(hi,target*1.12);
    $("#r-t").textContent=fmt(target);$("#r-r").textContent=fmt(red);$("#r-g").textContent=fmt(target)+" – "+fmt(askHi);
    const diff=target-cur;$("#r-d").textContent=(cur>0&&target>0&&Math.round(diff)!==0)?(diff>0?"+ ":"- ")+fmt(Math.abs(diff)):"—";
    const span=hi-lo||1,P=x=>Math.max(4,Math.min(96,(x-lo)/span*100));
    $("#rng").innerHTML=hi>lo?`<b style="right:${P(cur)}%;background:var(--muted)"></b><small style="right:${P(cur)}%">الحالي</small><b style="right:${P(red)}%;background:#e58b6b"></b><b style="right:${P(target)}%;background:var(--gold-hi)"></b><small style="right:${P(target)}%;top:-26px;color:var(--gold-hi)">المستهدف</small>`:"";

  };
  $("#sheetForm").addEventListener("input",calc);$("#sheetForm").addEventListener("submit",e=>e.preventDefault());
  $("#copySheet").addEventListener("click",()=>copyText($("#r-s").textContent));
  calc();
}
function vLog(){

  $("#logForm").addEventListener("submit",e=>{e.preventDefault();const a=$("#l-a").value.trim();if(!a)return;items=items.filter(x=>!x.ex);items.unshift({m:$("#l-m").value.trim()||"—",a,n:$("#l-n").value.trim(),w:$("#l-w").value.trim()});store.set("log",items);e.target.reset();render();toast("اتسجّل")});
  $("#logList").addEventListener("click",e=>{const b=e.target.closest("[data-del]");if(!b)return;items.splice(+b.dataset.del,1);store.set("log",items);render()});
  $("#copyLog").addEventListener("click",()=>copyText("ملف الإنجازات\n"+items.filter(x=>!x.ex).map(x=>`- ${x.m}: ${x.a}${x.n?" ("+x.n+")":""}`).join("\n")));
}
function vCheck(){
  const st=store.get("check",{});
  app.innerHTML=`<div class="view"><div class="ch-head"><div class="n">أداة · الجزء 3</div><h2 class="gold-text">قائمة التحضير</h2></div>
  <p class="lead">علّم على كل نقطة قبل اجتماع الزيادة بأسبوع.</p>
  <div class="card" id="chk">${CHECK.map((c,i)=>`<div class="check"><input type="checkbox" id="c${i}" ${st[i]?"checked":""}><label for="c${i}">${esc(c)}</label></div>`).join("")}</div>
  <div class="nav-row"><button type="button" id="resetChk">ابدأ من الأول</button><button type="button" data-go="scripts" class="primary">بنك السكريبتات</button></div></div>`;
  $("#chk").addEventListener("change",e=>{const i=+e.target.id.slice(1);st[i]=e.target.checked;store.set("check",st)});
  $("#resetChk").addEventListener("click",()=>{store.set("check",{});vCheck()});
}

/* ---------- router (hash, stays inside the app) ---------- */
const ROUTES=["home","buy","scripts","sheet","log","check",...CH.map(c=>c.id)];
function route(){
  stopReel();
  let r=(location.hash||"#home").slice(1); if(!ROUTES.includes(r))r="home"; if(isLocked(r)){r="buy";try{history.replaceState(null,"","#buy")}catch(e){}}
  const ch=CH.find(c=>c.id===r);
  $("#barTitle").textContent=ch?ch.n+" · "+ch.t:TITLES[r];
  $("#backBtn").hidden=r==="home";$("#homeBtn").hidden=r==="home";
  if(r==="home")vHome();else if(ch)vChapter(r);else ({buy:vBuy,scripts:vScripts,sheet:vSheet,log:vLog,check:vCheck})[r]();
  window.scrollTo(0,0);
}
let depth=0;
function go(r){if(("#"+r)===location.hash){route();return}depth++;location.hash=r}
window.addEventListener("hashchange",route);
document.addEventListener("click",e=>{const g=e.target.closest("[data-go]");if(g){e.preventDefault();go(g.dataset.go)}const c=e.target.closest("[data-copy]");if(c)copyText(SCRIPTS[+c.dataset.copy].x)});
$("#backBtn").addEventListener("click",()=>{if(depth>0){depth--;history.back()}else{location.hash="home"}});
$("#homeBtn").addEventListener("click",()=>go("home"));
/* block navigation to anything outside the app */
document.addEventListener("click",e=>{const a=e.target.closest("a[href]");if(a&&!a.getAttribute("href").startsWith("#")&&a.getAttribute("href")!==PAY_URL&&a.getAttribute("href")!==IG_URL&&a.getAttribute("href")!==TT_URL)e.preventDefault()},true);

/* ---------- a cappella pad: synthesized humming choir (Web Audio) ---------- */
const Music=(function(){
  let ctx=null,master=null,on=false,timer=null,step=0;
  // A minor: Am - F - C - G, voiced for 4 "voices"
  const PROG=[[57,60,64,69],[53,57,60,65],[55,60,64,67],[55,59,62,67]];
  const BASS=[45,41,48,43];
  const hz=m=>440*Math.pow(2,(m-69)/12);
  function reverb(){const len=ctx.sampleRate*3.2,b=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=b.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,2.6)}const cv=ctx.createConvolver();cv.buffer=b;return cv}
  function voice(freq,t0,dur,gainV,vowel){
    // glottal-like source: two detuned saws + vibrato, shaped by vowel formants
    const g=ctx.createGain();g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(gainV,t0+1.4);g.gain.setValueAtTime(gainV,t0+dur-1.6);g.gain.linearRampToValueAtTime(0,t0+dur+.4);
    const F=vowel==="o"?[[320,1],[800,.5],[2500,.12]]:[[260,1],[1900,.08],[2700,.05]]; // "oo" and "mm"
    const sum=ctx.createGain();sum.gain.value=.5;
    F.forEach(([f,a])=>{const bp=ctx.createBiquadFilter();bp.type="bandpass";bp.frequency.value=f;bp.Q.value=f<500?6:10;const ga=ctx.createGain();ga.gain.value=a;sum.connect(bp);bp.connect(ga);ga.connect(g)});
    const lp=ctx.createBiquadFilter();lp.type="lowpass";lp.frequency.value=3200;
    [-4,4].forEach(dt=>{const o=ctx.createOscillator();o.type="sawtooth";o.frequency.value=freq;o.detune.value=dt;
      const lfo=ctx.createOscillator(),lg=ctx.createGain();lfo.frequency.value=4.6+Math.random()*.8;lg.gain.value=freq*.006;lfo.connect(lg);lg.connect(o.frequency);
      o.connect(lp);o.start(t0);o.stop(t0+dur+.6);lfo.start(t0);lfo.stop(t0+dur+.6)});
    lp.connect(sum);g.connect(master);
  }
  function schedule(){
    const t=ctx.currentTime+.08,dur=6.4,ch=PROG[step%4];
    ch.forEach((m,k)=>voice(hz(m),t+k*.12,dur,k===3?.05:.075,"o"));
    voice(hz(BASS[step%4]),t,dur,.09,"m");
    step++;
  }
  function start(){
    try{
      if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();master=ctx.createGain();master.gain.value=0;const rv=reverb(),dry=ctx.createGain(),wet=ctx.createGain();dry.gain.value=.55;wet.gain.value=.6;const comp=ctx.createDynamicsCompressor();master.connect(dry);master.connect(rv);rv.connect(wet);dry.connect(comp);wet.connect(comp);comp.connect(ctx.destination)}
      ctx.resume();master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(.55,ctx.currentTime+2.5);
      if(!timer){schedule();timer=setInterval(schedule,6000)}
      on=true;return true;
    }catch(e){return false}
  }
  function stop(){if(!ctx)return;on=false;master.gain.cancelScheduledValues(ctx.currentTime);master.gain.linearRampToValueAtTime(0,ctx.currentTime+.8);setTimeout(()=>{if(!on){clearInterval(timer);timer=null;ctx.suspend()}},900)}
  document.addEventListener("visibilitychange",()=>{if(!ctx)return;if(document.hidden)ctx.suspend();else if(on)ctx.resume()});
  return{start,stop,get on(){return on}};
})();
const mBtn=$("#musicBtn");
function setMusic(p){if(p){if(Music.start())mBtn.setAttribute("aria-pressed","true")}else{Music.stop();mBtn.setAttribute("aria-pressed","false")}store.set("music",p)}
mBtn.addEventListener("click",()=>setMusic(!Music.on));

/* ---------- splash ---------- */
function leave(withMusic){if(withMusic)setMusic(true);$("#splash").classList.add("out");setTimeout(()=>{$("#splash").hidden=true},750)}
$("#startBtn").addEventListener("click",()=>leave(true));
$("#startMute").addEventListener("click",()=>leave(false));

route();
})();
